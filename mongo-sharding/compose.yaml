name: mongo-sharding
services:
  configSrv:
    container_name: configSrv
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    networks:
      app-network:
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet","--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s
      retries: 5

  shard1:
    container_name: shard1
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27018:27018"
    networks:
      app-network:
    volumes:
      - shard1-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet","--port","27018","--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s
      retries: 5

  shard2:
    container_name: shard2
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27019:27019"
    networks:
      app-network:
    volumes:
      - shard2-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet","--port","27019","--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s
      retries: 5

  router1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: router1
    restart: always
    ports:
      - "27020:27017"
    networks:
      app-network:
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv:27017", #передача данных сервера конфигурации
        "--bind_ip_all"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet","--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s
      retries: 5
    depends_on:
      configSrv:
        condition: service_healthy

  router2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: router2
    restart: always
    ports:
      - "27021:27017"
    networks:
      app-network:
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv:27017", #передача данных сервера конфигурации
        "--bind_ip_all"
      ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet","--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s
      retries: 5
    depends_on:
      configSrv:
        condition: service_healthy

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      router1:
        condition: service_started
      router2:
        condition: service_started
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: 'mongodb://router1:27017,router2:27017'
      MONGODB_DATABASE_NAME: "somedb"
    networks: [app-network]
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  config-data:
  shard1-data:
  shard2-data: